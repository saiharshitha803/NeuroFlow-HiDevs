services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuroflow-postgres

    environment:
      POSTGRES_DB: neuroflow
      POSTGRES_USER: neuroflow
      POSTGRES_PASSWORD: neuroflow123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuroflow-redis

    command:
      - redis-server
      - --requirepass
      - redis123
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: neuroflow-mlflow

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://neuroflow:neuroflow123@postgres:5432/neuroflow

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend

    container_name: neuroflow-api

    env_file:
      - ../.env

    command: uvicorn main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started

  worker:
    build:
      context: ../backend

    container_name: neuroflow-worker

    command: python -m db.worker

    env_file:
      - ../.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: neuroflow-jaeger

    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  postgres_data: